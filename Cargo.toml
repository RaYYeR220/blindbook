[workspace]
resolver = "2"
members = ["crates/core"]
exclude = ["contracts"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/RaYYeR220/blindbook"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
primitive-types = { version = "0.13", default-features = false }
thiserror = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
