[package]
name = "blindbook-pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Blindbook pool: sealed orders in, matcher results verified, settlement fanned out to the NEAR Intents verifier"
repository = "https://github.com/RaYYeR220/blindbook"

[lib]
crate-type = ["cdylib", "rlib"]

# Own workspace: the repo root excludes `contracts/`.
[workspace]
members = ["."]
exclude = ["e2e"]

[features]
# One-off testnet state upgrade (src/migrate.rs); never in the production build.
migrate-v0 = []

[dependencies]
near-sdk = "=5.30.1"
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }


[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
