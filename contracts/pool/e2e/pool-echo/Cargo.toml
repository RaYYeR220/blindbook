[package]
name = "pool-echo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test-only OutLayer module for the pool e2e: echoes settle payloads carried in its orders, signed with a predecessor-bound host key"
publish = false

[[bin]]
name = "pool-echo"
path = "src/main.rs"

# Not part of the pool workspace.
[workspace]

[dependencies]
outlayer = { version = "0.2.1", features = ["signing-keys", "encryption-keys"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
base64 = "0.22"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
debug = false
